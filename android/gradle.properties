org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Penyegecilan kod (R8) dimatikan dengan sengaja.
#
# Flutter menghidupkannya secara lalai untuk binaan release, tetapi R8 mengubah
# tandatangan fungsi `suspend` yang dijana Pigeon dalam plugin
# (shared_preferences) sehingga berlaku NoSuchMethodError pada masa jalan —
# storan kemajuan gagal dan app memaparkan skrin kosong pada peranti sebenar
# (binaan debug tidak terjejas). Saiz APK bertambah sedikit; kestabilan lebih
# penting untuk app kanak-kanak yang mesti berfungsi di luar talian.
shrink=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
